name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un nouveau push annule le run en cours sur la meme branche/PR plutot que de
# s'empiler derriere lui — sans annuler celui d'une autre branche/PR en parallele
# (groupe par ref, pas un seul groupe global partage entre toutes les PR).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tourne aussi sur les PR : la suite de tests est visible comme verification
  # avant fusion, pas seulement rejouee apres coup lors du deploiement.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    # Jamais sur une PR : seul un push reel (ou un declenchement manuel) sur main
    # publie le site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true active Pages au premier deploiement — ce depot ne l'avait
      # jamais eu, ni via Actions ni via une branche.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
