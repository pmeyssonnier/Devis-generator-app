name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Moindre privilege : le job de tests (qui tourne aussi sur les PR) n'a besoin que de
# lire le depot. Les droits Pages/OIDC sont accordes au seul job deploy.
permissions:
  contents: read

# Un nouveau push annule le run en cours sur la meme branche/PR plutot que de
# s'empiler derriere lui — sans annuler celui d'une autre branche/PR en parallele
# (groupe par ref, pas un seul groupe global partage entre toutes les PR).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tourne aussi sur les PR : les suites de tests sont visibles comme verification
  # avant fusion, pas seulement rejouees apres coup lors du deploiement.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Les tests unitaires ne voient ni le DOM, ni IndexedDB, ni un telechargement :
  # deux parcours navigateur completent la couverture la ou elle manquait, sur les
  # PR comme sur main. Ils n'atteignent aucun reseau — SheetJS est servi depuis
  # node_modules plutot que depuis le CDN.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [test, e2e]
    # Jamais sur une PR : seul un push reel (ou un declenchement manuel) sur main
    # publie le site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true active Pages au premier deploiement — ce depot ne l'avait
      # jamais eu, ni via Actions ni via une branche.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # L'outillage de developpement n'a rien a faire sur le site publie : la skill
      # de design pese 5 Mo et ne sert qu'en local. Suppression dans la copie de
      # travail du job, jamais dans le depot.
      - run: rm -rf .claude .github node_modules test playwright.config.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
